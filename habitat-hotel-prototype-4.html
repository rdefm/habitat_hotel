<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habitat Hotel — Prototype</title>
<style>
  :root {
    --color-bg: #F5EFE6;
    --color-primary: #3B6E5E;
    --color-accent: #E8A33D;
    --color-green: #4CAF50;
    --color-sky: #bfe0ee;
    --color-ink: #2B2B2B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--color-bg);
    color: var(--color-ink);
    display: flex;
    justify-content: center;
  }
  #app {
    width: 390px;
    max-width: 100vw;
    min-height: 100vh;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* HEADER */
  header { background: var(--color-primary); color: white; border-radius: 10px; padding: 8px 12px; }
  .header-top { display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 14px; margin: 0; font-family: Georgia, serif; font-weight: normal; }
  .phase-bar { height: 5px; background: rgba(255,255,255,0.25); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .phase-fill { height: 100%; background: var(--color-accent); width: 0%; }
  .funds-line { font-size: 10px; color: rgba(255,255,255,0.85); margin-top: 5px; }
  .controls { display: flex; gap: 6px; }
  .controls button { background: rgba(255,255,255,0.18); border: none; color: white; padding: 4px 8px; border-radius: 6px; font-size: 11px; }

  /* TERRACE / RESTAURANT */
  #terrace { background: linear-gradient(to bottom, var(--color-sky), #d8ceb8); border-radius: 10px; padding: 8px; }
  .terrace-label { font-size: 10px; font-family: Georgia, serif; color: #2B2B2B; margin-bottom: 5px; }
  .terrace-row { display: flex; gap: 8px; }
  .kitchen-station-wrap { flex: 1; background: var(--color-primary); border-radius: 8px; }
  .special-picker { flex: 1; background: rgba(255,255,255,0.4); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .special-label { font-size: 7.5px; color: #555; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.3px; }
  .special-options { display: flex; gap: 4px; }
  .special-pill { font-size: 15px; background: white; border-radius: 6px; padding: 3px 5px; cursor: pointer; opacity: 0.5; }
  .special-pill.active { opacity: 1; box-shadow: 0 0 0 2px var(--color-accent); }
  .terrace-queue-area { min-height: 34px; background: rgba(255,255,255,0.4); border-radius: 8px; display: flex; align-items: center; padding: 6px 8px; color: #555; font-size: 9px; margin-top: 6px; }
  .terrace-dinner-strip { min-height: 34px; background: rgba(255,255,255,0.4); border-radius: 8px; display: flex; gap: 6px; align-items: center; padding: 6px 8px; overflow-x: auto; }
  .meal-section { margin-top: 6px; }
  .meal-section-label { font-size: 7.5px; color: #4a4a4a; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 2px; }

  /* BUILDING */
  #building { background: #E4DCC8; border-radius: 10px 10px 0 0; overflow: hidden; display: flex; }
  .shaft-col {
    width: 34px;
    background: #cfc6ae;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
  }
  .elevator-car {
    width: 24px; height: 24px;
    margin-top: auto;
    margin-bottom: 8px;
    background: var(--color-primary);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  .floors-col { flex: 1; min-width: 0; }
  .floor-row {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 6px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  .floor-label { width: 82px; flex-shrink: 0; }
  .floor-name { font-weight: bold; font-size: 10.5px; font-family: Georgia, serif; line-height: 1.2; }
  .floor-meta { font-size: 7.5px; color: #666; line-height: 1.25; margin-top: 1px; }
  .floor-rooms-strip {
    display: flex;
    gap: 5px;
    overflow-x: auto;
    flex: 1;
    min-width: 0;
    padding: 2px 0;
  }

  /* ROOM CARDS (compact — one per floor slot) */
  .room-card-mini {
    width: 54px; height: 54px;
    flex-shrink: 0;
    background: white;
    border-radius: 8px;
    border: 2px solid transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: border-color 0.4s ease, background 0.4s ease;
  }
  .room-card-mini.status-clean { border-color: var(--color-primary); }
  .room-card-mini.status-dirty { border-color: #b0a89a; opacity: 0.65; }
  .room-card-mini.status-cleaning { border-color: var(--color-primary); background: #eef5f0; }
  .room-card-mini.status-occupied { border-color: var(--color-accent); cursor: pointer; }
  .room-card-mini.status-checking-in { border-color: #cf8b3f; background: #fff8ec; }
  .room-card-mini.highlight-green { border-color: var(--color-green); background: #eaf7ec; box-shadow: 0 0 0 2px var(--color-green); cursor: pointer; }
  .room-card-mini.highlight-amber { border-color: #cf8b3f; background: #fff1e0; box-shadow: 0 0 0 2px #cf8b3f; cursor: pointer; }
  @keyframes fadeIn { from { opacity: 0.3; } to { opacity: 1; } }
  .room-icon { font-size: 18px; position: relative; display: inline-block; }
  .room-icon .staff-badge-mini { position: absolute; bottom: -3px; right: -7px; font-size: 8px; }
  .room-icon .dinner-badge { position: absolute; top: -5px; left: -7px; font-size: 8px; }
  .room-party-badge { font-size: 7px; color: #555; margin-top: 1px; }
  .room-status-mini { font-size: 7px; text-transform: uppercase; letter-spacing: 0.3px; color: var(--color-primary); margin-top: 2px; }

  .build-slot {
    width: 54px; height: 54px;
    flex-shrink: 0;
    border-radius: 8px;
    border: 2px dashed #b8ae95;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #948c76;
    font-size: 20px;
    cursor: pointer;
  }
  .construction-slot {
    width: 54px; height: 54px;
    flex-shrink: 0;
    border-radius: 8px;
    border: 2px dashed var(--color-accent);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--color-accent);
    font-size: 16px;
    text-align: center;
  }
  .construction-label { font-size: 6.5px; line-height: 1.1; margin-top: 2px; }

  /* RECEPTION */
  #reception { background: var(--color-primary); border-radius: 0 0 10px 10px; padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; }
  .reception-label { color: rgba(255,255,255,0.6); font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; }
  .reception-row { display: flex; gap: 8px; }
  .housekeeping-status { color: rgba(255,255,255,0.75); font-size: 9px; }
  .station-warnings { font-size: 8px; color: #ffdca8; line-height: 1.4; }

  /* STATIONS & STAFF */
  .station-slot {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    background: rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 6px 4px 5px;
    cursor: pointer;
  }
  .station-slot.station-target { background: rgba(76,175,80,0.32); box-shadow: 0 0 0 2px var(--color-green); }
  .station-chips { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
  .station-name { font-size: 7.5px; color: rgba(255,255,255,0.65); margin-top: 1px; text-align: center; }
  .empty-station { font-size: 9px; color: rgba(255,255,255,0.5); padding: 11px 0; }
  .staff-chip { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .staff-chip.selected { box-shadow: 0 0 0 2px var(--color-accent); border-radius: 6px; }
  .staff-chip.away { opacity: 0.5; }
  .staff-emoji { font-size: 22px; position: relative; }
  .staff-badge { position: absolute; bottom: -3px; right: -6px; font-size: 11px; }
  .staff-name { color: rgba(255,255,255,0.75); font-size: 8px; }
  .staff-skill { color: rgba(255,255,255,0.65); font-size: 7.5px; }
  .away-label { color: rgba(255,255,255,0.6); font-size: 7px; }

  /* ARRIVAL QUEUE & SELECTED-GUEST BAR */
  .queue-area {
    min-height: 40px;
    background: rgba(255,255,255,0.12);
    border-radius: 8px;
    display: flex;
    align-items: center;
    padding: 6px 8px;
    color: rgba(255,255,255,0.55);
    font-size: 9px;
  }
  .queue-strip {
    min-height: 40px;
    background: rgba(255,255,255,0.12);
    border-radius: 8px;
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 6px 8px;
    overflow-x: auto;
  }
  .guest-card {
    background: white;
    border-radius: 6px;
    padding: 3px 7px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 28px;
    flex-shrink: 0;
    transition: background 0.4s ease;
    cursor: pointer;
  }
  .guest-card.patience-impatient { background: #fdeec7; }
  .guest-card.patience-huffy { background: #f7c9c2; }
  .guest-card.eating { background: #fff3d6; }
  .guest-card.selected { box-shadow: 0 0 0 2px var(--color-accent); }
  .guest-emoji { font-size: 18px; position: relative; display: inline-block; }
  .guest-emoji .eating-badge { position: absolute; bottom: -4px; right: -6px; font-size: 9px; }
  .party-badge { font-size: 8px; color: #555; }

  .selected-guest-bar {
    background: rgba(255,255,255,0.14);
    border-radius: 8px;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .selected-guest-info { color: white; font-size: 10px; }
  .dinner-toggle {
    background: rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.8);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 9px;
    cursor: pointer;
    white-space: nowrap;
  }
  .dinner-toggle.on { background: var(--color-accent); color: white; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 50;
  }
  .modal-card {
    background: white;
    border-radius: 12px;
    padding: 16px;
    width: 250px;
  }
  .modal-title { font-family: Georgia, serif; font-size: 14px; margin-bottom: 8px; }
  .modal-body { font-size: 12px; color: #555; margin-bottom: 14px; line-height: 1.4; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-actions.stacked { flex-direction: column; align-items: stretch; }
  .modal-actions button { border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; }
  .modal-actions button[disabled] { opacity: 0.5; cursor: not-allowed; }
  .btn-cancel { background: #eee; color: #333; }
  .btn-confirm { background: var(--color-accent); color: white; }
  .file-label { text-align: center; cursor: pointer; position: relative; overflow: hidden; }
  .file-label input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// === DATA ===
// Rooms through ★2 only (5 types — see earlier note about §13/§5 mismatch)
const ROOM_TYPES = {
  cozyNook:     { type: 'cozyNook',     name: 'Cozy Nook',     tags: ['warm','dry','quiet'],       capacity: 2, tier: 1 },
  roostLoft:    { type: 'roostLoft',    name: 'Roost Loft',    tags: ['highPerch','dry'],          capacity: 6, tier: 1 },
  lagoonRoom:   { type: 'lagoonRoom',   name: 'Lagoon Room',   tags: ['warm','water'],             capacity: 3, tier: 1 },
  verandaSuite: { type: 'verandaSuite', name: 'Veranda Suite', tags: ['warm','water','spacious'],  capacity: 6, tier: 2 },
  iceGrotto:    { type: 'iceGrotto',    name: 'Ice Grotto',    tags: ['cold','water'],             capacity: 4, tier: 2 },
};

// One floor per habitat now. Top of array = top floor (tier 2 up top, tier 1 near reception).
const FLOOR_TYPES_TOP_TO_BOTTOM = ['iceGrotto', 'verandaSuite', 'lagoonRoom', 'roostLoft', 'cozyNook'];

const HOUSEKEEPING_ORDER = ['cozyNook','roostLoft','lagoonRoom','verandaSuite','iceGrotto'];

// Slice roster — five species, tiers 1-2 (§5 table)
const SPECIES = {
  pigeon:   { name: 'Pigeon',   emoji: '🐦', tier: 1, needs: ['highPerch'],    likes: [],           budget: 'low', partyMin: 1, partyMax: 6, stayMin: 1, stayMax: 2 },
  capybara: { name: 'Capybara', emoji: '🦫', tier: 1, needs: ['warm','water'], likes: ['quiet'],    budget: 'low', partyMin: 1, partyMax: 3, stayMin: 2, stayMax: 4 },
  tortoise: { name: 'Tortoise', emoji: '🐢', tier: 1, needs: ['warm','dry'],   likes: ['quiet'],    budget: 'low', partyMin: 1, partyMax: 1, stayMin: 3, stayMax: 6 },
  penguin:  { name: 'Penguin',  emoji: '🐧', tier: 2, needs: ['cold','water'], likes: ['quiet'],    budget: 'mid', partyMin: 1, partyMax: 4, stayMin: 1, stayMax: 3 },
  flamingo: { name: 'Flamingo', emoji: '🦩', tier: 2, needs: ['warm','water'], likes: ['spacious'], budget: 'mid', partyMin: 2, partyMax: 6, stayMin: 1, stayMax: 2 },
};

// One species-flavored special apiece (§9's food comedy, simplified to a fixed set rather than
// genuine rotating content).
const DAILY_SPECIALS = {
  pigeon:   { name: 'Assorted Seed Mix',      emoji: '🌾' },
  capybara: { name: 'Garden Salad Bar',       emoji: '🥗' },
  tortoise: { name: 'Slow-Roast Veg Plate',   emoji: '🥕' },
  penguin:  { name: 'Fresh Fish Platter',     emoji: '🐟' },
  flamingo: { name: 'Shrimp & Algae Feast',   emoji: '🦐' },
};

// Staff — "id" is just a stable identifier (their original home role), not their current station.
// Every staffer has a skill (1-5) at every station, lopsided toward their home role.
const STAFF = [
  { id: 'receptionist', name: 'Biscuit', emoji: '🐶', skills: { reception: 5, bellhop: 2, housekeeping: 2, kitchen: 1 } },
  { id: 'bellhop',      name: 'Marlon',  emoji: '🐒', skills: { reception: 2, bellhop: 5, housekeeping: 3, kitchen: 3 } },
  { id: 'cleaner',      name: 'Shelly',  emoji: '🐢', skills: { reception: 1, bellhop: 1, housekeeping: 5, kitchen: 2 } },
];

const STATION_LABELS = { reception: 'Check-in desk', bellhop: 'Bellhop', housekeeping: 'Housekeeping', kitchen: 'Kitchen' };

const PHASE_ORDER = ['morning','afternoon','evening','night'];
const PHASE_DURATIONS = { morning: 15, afternoon: 30, evening: 20, night: 10 }; // ~75s/day

// Housekeeping speed depends on the assigned staffer's skill rather than a flat constant.
const CLEAN_SECONDS_BY_SKILL = { 1: 10, 2: 8, 3: 6.5, 4: 5, 5: 4 };
function cleanDurationForSkill(skill) { return CLEAN_SECONDS_BY_SKILL[skill] || 8; }

// Dinner-service speed (only matters for staff who clear the DINNER_MIN_SKILL bar below).
const MEAL_SECONDS_BY_SKILL = { 1: 9, 2: 7, 3: 5.5, 4: 4.5, 5: 3.5 };
function mealDurationForSkill(skill) { return MEAL_SECONDS_BY_SKILL[skill] || 8; }

const ARRIVAL_MIN_INTERVAL = 4;
const ARRIVAL_MAX_INTERVAL = 6;
const PATIENCE_IMPATIENT_AT = 8;
const PATIENCE_HUFFY_AT = 16;
const PATIENCE_LEAVE_AT = 22;
const RECEPTION_UNSTAFFED_PATIENCE_MULTIPLIER = 1.6; // empty desk -> patience burns faster

const CHECKIN_DELAY_SECONDS = 4; // extra delay when bellhop is unstaffed

const POPIN_MIN_INTERVAL = 12;
const POPIN_MAX_INTERVAL = 22;

// Dining placeholders (§9) — same "illustrative, not tuned" caveat as the rest of the economy.
const BREAKFAST_MIN_SKILL = 1;  // basically: is ANYONE assigned to Kitchen at all
const DINNER_MIN_SKILL = 3;     // need a genuinely competent cook to run dinner/walk-in service
const BREAKFAST_RATE_PER_GUEST = 3;      // $ per occupied guest, once served
const DINNER_ADDON_RATE_PER_GUEST = 8;   // $ per guest per night, for parties who opted into dinner at check-in
const WALKIN_REVENUE_PER_DINER = 12;     // $ per walk-in diner served — cash only, no Hearts (§9)
const WALKIN_MIN_INTERVAL = 5;
const WALKIN_MAX_INTERVAL = 8;
const WALKIN_PATIENCE_IMPATIENT_AT = 8;
const WALKIN_PATIENCE_HUFFY_AT = 14;
const WALKIN_PATIENCE_LEAVE_AT = 20;

// Breakfast service speed (mirrors dinner's skill-based table, but quicker overall).
const BREAKFAST_SECONDS_BY_SKILL = { 1: 6, 2: 5, 3: 4, 4: 3.5, 5: 3 };
function breakfastDurationForSkill(skill) { return BREAKFAST_SECONDS_BY_SKILL[skill] || 6; }

// Breakfast queue works exactly like the reception arrival queue: patience decays, and decays
// FASTER if nobody's covering the Kitchen — mirrors RECEPTION_UNSTAFFED_PATIENCE_MULTIPLIER.
const BREAKFAST_UNSTAFFED_PATIENCE_MULTIPLIER = 1.6;
const BREAKFAST_PATIENCE_IMPATIENT_AT = 6;
const BREAKFAST_PATIENCE_HUFFY_AT = 11;
const BREAKFAST_PATIENCE_LEAVE_AT = 16;

// Economy placeholders — the design doc explicitly defers real pricing to a later
// balancing pass (§8/§13), so these are illustrative, not tuned.
const STARTING_FUNDS = 500;
const BUDGET_NIGHTLY_RATE = { low: 10, mid: 18 }; // $ per guest, per night

// Construction
const MAX_ROOMS_PER_FLOOR = 4;
const BUILD_COST_BY_TIER = { 1: 250, 2: 500 };
const BUILD_DURATION_DAYS = 1;

// === STATE ===
const gameState = {
  day: 1,
  phase: 'morning',
  phaseTimeElapsed: 0,
  paused: false,
  speed: 1,
  rooms: [],
  roomInstanceCounts: {},
  construction: {},
  housekeepingQueue: [],
  cleaningJobs: [], // active parallel cleans: [{ staffId, targetRoomId, progress, duration }]
  stations: { reception: ['receptionist'], bellhop: ['bellhop'], housekeeping: ['cleaner'], kitchen: [] },
  selectedStaffId: null,
  arrivalQueue: [],
  arrivalTimer: 0,
  popinTimer: 0,
  nextGuestId: 1,
  selectedGuestId: null,
  pendingSeat: null,
  viewingRoomId: null,
  pendingBuild: null,
  funds: STARTING_FUNDS,
  showSaveModal: false,
  lastSavedAt: null,
  // Dining
  dailySpecial: null,       // species key, or null = no special chosen
  dinnerQueue: [],          // walk-in diners: { id, species, partySize, waitTime, patience } — stay here while being served too
  dinnerTimer: 0,
  mealJobs: [],             // active dinner-service jobs: [{ staffId, dinerId, progress, duration }]
  nextDinerId: 1,
  breakfastQueue: [],       // { id, roomId, species, partySize, waitTime, patience } — populated once each morning
  breakfastJobs: [],        // active breakfast-service jobs: [{ staffId, entryId, progress, duration }]
  nextBreakfastEntryId: 1,
};

// === INIT ===
function makeRoomInstance(type, instanceNum) {
  const rt = ROOM_TYPES[type];
  return {
    id: type + '_' + instanceNum,
    type: type,
    name: rt.name,
    tags: rt.tags,
    capacity: rt.capacity,
    tier: rt.tier,
    status: 'clean', // clean | dirty | cleaning | checking-in | occupied
    occupants: [],
    checkinProgress: 0,
  };
}

function initGame() {
  gameState.rooms = [];
  Object.keys(ROOM_TYPES).forEach(type => {
    gameState.roomInstanceCounts[type] = 1;
    gameState.construction[type] = null;
    gameState.rooms.push(makeRoomInstance(type, 1));
  });
  getRoomsByType('lagoonRoom')[0].status = 'dirty';
  getRoomsByType('iceGrotto')[0].status = 'dirty';
  rebuildHousekeepingQueue();
  gameState.popinTimer = randomBetween(POPIN_MIN_INTERVAL, POPIN_MAX_INTERVAL);
  gameState.dinnerTimer = randomBetween(WALKIN_MIN_INTERVAL, WALKIN_MAX_INTERVAL);
}

function getRoomById(id) { return gameState.rooms.find(r => r.id === id); }
function getRoomsByType(type) { return gameState.rooms.filter(r => r.type === type); }
function findStationOf(staffId) { return Object.keys(gameState.stations).find(k => gameState.stations[k].includes(staffId)) || null; }
function isActivelyCleaning(staffId) { return gameState.cleaningJobs.some(j => j.staffId === staffId); }

function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randomBetween(min, max) { return Math.random() * (max - min) + min; }

// === SYSTEMS: SAVE / LOAD ===
const SAVE_KEY = 'save';

// Lightweight forward-compatibility shim — fills in fields that didn't exist in older saves,
// rather than a full versioned migration system.
function applyDefaults() {
  if (!gameState.stations.kitchen) gameState.stations.kitchen = [];
  if (!gameState.dinnerQueue) gameState.dinnerQueue = [];
  if (gameState.dinnerTimer === undefined) gameState.dinnerTimer = randomBetween(WALKIN_MIN_INTERVAL, WALKIN_MAX_INTERVAL);
  if (!gameState.mealJobs) gameState.mealJobs = [];
  if (gameState.dailySpecial === undefined) gameState.dailySpecial = null;
  if (gameState.nextDinerId === undefined) gameState.nextDinerId = 1;
  if (!gameState.breakfastQueue) gameState.breakfastQueue = [];
  if (!gameState.breakfastJobs) gameState.breakfastJobs = [];
  if (gameState.nextBreakfastEntryId === undefined) gameState.nextBreakfastEntryId = 1;
}

// Fields that shouldn't survive a save/load round-trip — transient UI state, not game state.
function sanitizeTransientState() {
  gameState.selectedGuestId = null;
  gameState.selectedStaffId = null;
  gameState.viewingRoomId = null;
  gameState.pendingBuild = null;
  gameState.pendingSeat = null;
  gameState.showSaveModal = false;
  gameState.paused = false;
}

async function manualSave() {
  try {
    const payload = JSON.stringify(gameState);
    const result = await window.storage.set(SAVE_KEY, payload, false);
    if (result) gameState.lastSavedAt = new Date().toLocaleTimeString();
  } catch (e) {
    console.error('Save failed', e);
  }
  renderGame();
}

async function autoSave() {
  try {
    const payload = JSON.stringify(gameState);
    await window.storage.set(SAVE_KEY, payload, false);
    gameState.lastSavedAt = new Date().toLocaleTimeString() + ' (auto)';
  } catch (e) {
    console.error('Autosave failed', e);
  }
}

async function loadSavedGame() {
  try {
    const result = await window.storage.get(SAVE_KEY, false);
    if (result && result.value) {
      const loaded = JSON.parse(result.value);
      Object.assign(gameState, loaded);
      applyDefaults();
      return true;
    }
  } catch (e) {
    console.log('No existing save found:', e.message || e);
  }
  return false;
}

function exportSave() {
  const payload = JSON.stringify(gameState, null, 2);
  const blob = new Blob([payload], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'habitat-hotel-save-day' + gameState.day + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importSaveFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const loaded = JSON.parse(e.target.result);
      Object.assign(gameState, loaded);
      applyDefaults();
      sanitizeTransientState();
      renderGame();
    } catch (err) {
      alert("Couldn't read that file — is it a valid Habitat Hotel save?");
    }
  };
  reader.readAsText(file);
}

function openSaveModal() {
  gameState.showSaveModal = true;
  gameState.selectedGuestId = null;
  gameState.selectedStaffId = null;
  gameState.viewingRoomId = null;
  gameState.pendingBuild = null;
  gameState.pendingSeat = null;
  renderGame();
}

function closeSaveModal() {
  gameState.showSaveModal = false;
  renderGame();
}

// === SYSTEMS: DAY CLOCK ===
function tickClock(deltaSeconds) {
  gameState.phaseTimeElapsed += deltaSeconds;
  while (gameState.phaseTimeElapsed >= PHASE_DURATIONS[gameState.phase]) {
    gameState.phaseTimeElapsed -= PHASE_DURATIONS[gameState.phase];
    advancePhase();
  }
}

function advancePhase() {
  const idx = PHASE_ORDER.indexOf(gameState.phase);
  const nextIdx = (idx + 1) % PHASE_ORDER.length;
  const enteringPhase = PHASE_ORDER[nextIdx];

  if (nextIdx === 0) {
    gameState.day += 1;
    startNewDay();
  }
  gameState.phase = enteringPhase;
  if (enteringPhase === 'afternoon') {
    gameState.arrivalTimer = randomBetween(ARRIVAL_MIN_INTERVAL, ARRIVAL_MAX_INTERVAL);
  }
  if (enteringPhase === 'night') {
    processNightlyIncome();
  }
}

function processNightlyIncome() {
  gameState.rooms.forEach(r => {
    if (r.status === 'occupied' && r.occupants.length > 0) {
      const occ = r.occupants[0];
      const rate = BUDGET_NIGHTLY_RATE[SPECIES[occ.species].budget] || 10;
      gameState.funds += rate * occ.partySize;
      if (occ.wantsDinner) {
        gameState.funds += DINNER_ADDON_RATE_PER_GUEST * occ.partySize;
      }
    }
  });
}

// Every currently-staying guest joins the breakfast queue once each morning — like the
// reception arrival queue, just populated all at once instead of trickling in. Actual serving
// and patience happen in tickBreakfast(), same as reception.
function populateBreakfastQueue() {
  gameState.breakfastQueue = [];
  gameState.breakfastJobs = [];
  gameState.rooms.forEach(r => {
    if (r.status === 'occupied' && r.occupants.length > 0) {
      const occ = r.occupants[0];
      gameState.breakfastQueue.push({
        id: 'bkfst' + (gameState.nextBreakfastEntryId++),
        roomId: r.id,
        species: occ.species,
        partySize: occ.partySize,
        waitTime: 0,
        patience: 'content',
      });
    }
  });
}

function startNewDay() {
  processCheckouts();
  populateBreakfastQueue();
  processConstruction();
  autoSave();
}

function processCheckouts() {
  gameState.rooms.forEach(r => {
    if (r.status === 'occupied' && r.occupants.length > 0) {
      const guest = r.occupants[0];
      const nightsStayed = gameState.day - guest.checkInDay;
      if (nightsStayed >= guest.stayLength) {
        r.occupants = [];
        r.status = 'dirty';
      }
    }
  });
  rebuildHousekeepingQueue();
}

function processConstruction() {
  Object.keys(gameState.construction).forEach(type => {
    const c = gameState.construction[type];
    if (c && gameState.day >= c.readyDay) {
      const nextNum = gameState.roomInstanceCounts[type] + 1;
      gameState.roomInstanceCounts[type] = nextNum;
      gameState.rooms.push(makeRoomInstance(type, nextNum));
      gameState.construction[type] = null;
    }
  });
}

function rebuildHousekeepingQueue() {
  const activeTargets = gameState.cleaningJobs.map(j => j.targetRoomId);
  gameState.housekeepingQueue = [];
  HOUSEKEEPING_ORDER.forEach(type => {
    getRoomsByType(type).forEach(r => {
      if (r.status === 'dirty' && !activeTargets.includes(r.id)) {
        gameState.housekeepingQueue.push(r.id);
      }
    });
  });
}

// === SYSTEMS: HOUSEKEEPING (parallel — every assigned staffer can clean a different room at once) ===
function tickHousekeeping(deltaSeconds) {
  const housekeeperIds = gameState.stations.housekeeping;

  housekeeperIds.forEach(staffId => {
    if (isActivelyCleaning(staffId)) return;
    if (gameState.housekeepingQueue.length === 0) return;
    const nextId = gameState.housekeepingQueue.shift();
    const staffer = STAFF.find(s => s.id === staffId);
    gameState.cleaningJobs.push({
      staffId,
      targetRoomId: nextId,
      progress: 0,
      duration: cleanDurationForSkill(staffer.skills.housekeeping),
    });
    getRoomById(nextId).status = 'cleaning';
  });

  gameState.cleaningJobs.forEach(job => { job.progress += deltaSeconds; });
  gameState.cleaningJobs.filter(j => j.progress >= j.duration).forEach(j => {
    getRoomById(j.targetRoomId).status = 'clean';
  });
  gameState.cleaningJobs = gameState.cleaningJobs.filter(j => j.progress < j.duration);
}

// === SYSTEMS: CHECK-IN DELAY (bellhop-gated) ===
function tickCheckins(deltaSeconds) {
  gameState.rooms.forEach(r => {
    if (r.status === 'checking-in') {
      r.checkinProgress += deltaSeconds;
      if (r.checkinProgress >= CHECKIN_DELAY_SECONDS) {
        r.status = 'occupied';
        r.checkinProgress = 0;
      }
    }
  });
}

// === SYSTEMS: ARRIVALS ===
function spawnGuest() {
  const speciesKeys = Object.keys(SPECIES);
  const speciesKey = speciesKeys[Math.floor(Math.random() * speciesKeys.length)];
  const sp = SPECIES[speciesKey];
  const partySize = randomInt(sp.partyMin, sp.partyMax);
  gameState.arrivalQueue.push({
    id: 'guest' + (gameState.nextGuestId++),
    species: speciesKey,
    partySize,
    waitTime: 0,
    patience: 'content',
    wantsDinner: false,
  });
}

function tickArrivals(deltaSeconds) {
  if (gameState.phase === 'afternoon') {
    gameState.arrivalTimer -= deltaSeconds;
    if (gameState.arrivalTimer <= 0) {
      spawnGuest();
      gameState.arrivalTimer += randomBetween(ARRIVAL_MIN_INTERVAL, ARRIVAL_MAX_INTERVAL);
    }
  }

  const patienceMultiplier = gameState.stations.reception.length > 0 ? 1 : RECEPTION_UNSTAFFED_PATIENCE_MULTIPLIER;
  gameState.arrivalQueue.forEach(g => { g.waitTime += deltaSeconds * patienceMultiplier; });
  gameState.arrivalQueue = gameState.arrivalQueue.filter(g => g.waitTime < PATIENCE_LEAVE_AT);
  gameState.arrivalQueue.forEach(g => {
    if (g.waitTime >= PATIENCE_HUFFY_AT) g.patience = 'huffy';
    else if (g.waitTime >= PATIENCE_IMPATIENT_AT) g.patience = 'impatient';
    else g.patience = 'content';
  });
}

// === SYSTEMS: POP-INS ===
function tickPopins(deltaSeconds) {
  if (gameState.phase === 'afternoon') return;
  gameState.popinTimer -= deltaSeconds;
  if (gameState.popinTimer <= 0) {
    spawnGuest();
    gameState.popinTimer += randomBetween(POPIN_MIN_INTERVAL, POPIN_MAX_INTERVAL);
  }
}

// === SYSTEMS: DINING (walk-in dinner service, evening only) ===
function spawnDiner() {
  const speciesKeys = Object.keys(SPECIES);
  let speciesKey;
  if (gameState.dailySpecial && Math.random() < 0.5) {
    speciesKey = gameState.dailySpecial; // the special pulls in more of that species
  } else {
    speciesKey = speciesKeys[Math.floor(Math.random() * speciesKeys.length)];
  }
  const sp = SPECIES[speciesKey];
  gameState.dinnerQueue.push({
    id: 'diner' + (gameState.nextDinerId++),
    species: speciesKey,
    partySize: randomInt(sp.partyMin, sp.partyMax),
    waitTime: 0,
    patience: 'content',
  });
}

function isDinerBeingServed(dinerId) { return gameState.mealJobs.some(j => j.dinerId === dinerId); }

// A kitchen staffer can only work one job at a time — breakfast and dinner share the same
// people, so both systems check this before handing out new work.
function isKitchenStaffBusy(staffId) {
  return gameState.breakfastJobs.some(j => j.staffId === staffId) || gameState.mealJobs.some(j => j.staffId === staffId);
}

function tickDinnerArrivals(deltaSeconds) {
  if (gameState.phase === 'evening') {
    gameState.dinnerTimer -= deltaSeconds;
    if (gameState.dinnerTimer <= 0) {
      spawnDiner();
      gameState.dinnerTimer += randomBetween(WALKIN_MIN_INTERVAL, WALKIN_MAX_INTERVAL);
    }
  }
  // Patience is frozen while a diner is actively being served — they're not "waiting" anymore.
  gameState.dinnerQueue.forEach(d => {
    if (isDinerBeingServed(d.id)) return;
    d.waitTime += deltaSeconds;
  });
  gameState.dinnerQueue = gameState.dinnerQueue.filter(d => isDinerBeingServed(d.id) || d.waitTime < WALKIN_PATIENCE_LEAVE_AT);
  gameState.dinnerQueue.forEach(d => {
    if (isDinerBeingServed(d.id)) return;
    if (d.waitTime >= WALKIN_PATIENCE_HUFFY_AT) d.patience = 'huffy';
    else if (d.waitTime >= WALKIN_PATIENCE_IMPATIENT_AT) d.patience = 'impatient';
    else d.patience = 'content';
  });
}

// Only staff meeting DINNER_MIN_SKILL can run dinner service — a low-skill kitchen assignment
// covers breakfast just fine but simply won't pick up walk-ins. Diners stay visible in the
// queue the whole time (waiting -> eating -> gone), rather than disappearing the instant
// service starts.
function tickKitchen(deltaSeconds) {
  gameState.stations.kitchen.forEach(staffId => {
    if (isKitchenStaffBusy(staffId)) return;
    const staffer = STAFF.find(s => s.id === staffId);
    if (staffer.skills.kitchen < DINNER_MIN_SKILL) return;
    const nextDiner = gameState.dinnerQueue.find(d => !isDinerBeingServed(d.id));
    if (!nextDiner) return;
    gameState.mealJobs.push({
      staffId,
      dinerId: nextDiner.id,
      progress: 0,
      duration: mealDurationForSkill(staffer.skills.kitchen),
    });
  });

  gameState.mealJobs.forEach(job => { job.progress += deltaSeconds; });
  gameState.mealJobs.filter(j => j.progress >= j.duration).forEach(j => {
    const diner = gameState.dinnerQueue.find(d => d.id === j.dinerId);
    if (diner) {
      gameState.funds += WALKIN_REVENUE_PER_DINER * diner.partySize;
      gameState.dinnerQueue = gameState.dinnerQueue.filter(d => d.id !== diner.id);
    }
  });
  gameState.mealJobs = gameState.mealJobs.filter(j => j.progress < j.duration);
}

// === SYSTEMS: BREAKFAST QUEUE (mirrors the reception arrival queue exactly) ===
function isBreakfastEntryBeingServed(entryId) { return gameState.breakfastJobs.some(j => j.entryId === entryId); }

function tickBreakfast(deltaSeconds) {
  const canServe = gameState.stations.kitchen.some(id => STAFF.find(s => s.id === id).skills.kitchen >= BREAKFAST_MIN_SKILL);
  const patienceMultiplier = canServe ? 1 : BREAKFAST_UNSTAFFED_PATIENCE_MULTIPLIER;

  gameState.breakfastQueue.forEach(e => {
    if (isBreakfastEntryBeingServed(e.id)) return;
    e.waitTime += deltaSeconds * patienceMultiplier;
  });
  gameState.breakfastQueue = gameState.breakfastQueue.filter(e => isBreakfastEntryBeingServed(e.id) || e.waitTime < BREAKFAST_PATIENCE_LEAVE_AT);
  gameState.breakfastQueue.forEach(e => {
    if (isBreakfastEntryBeingServed(e.id)) return;
    if (e.waitTime >= BREAKFAST_PATIENCE_HUFFY_AT) e.patience = 'huffy';
    else if (e.waitTime >= BREAKFAST_PATIENCE_IMPATIENT_AT) e.patience = 'impatient';
    else e.patience = 'content';
  });

  gameState.stations.kitchen.forEach(staffId => {
    if (isKitchenStaffBusy(staffId)) return;
    const staffer = STAFF.find(s => s.id === staffId);
    if (staffer.skills.kitchen < BREAKFAST_MIN_SKILL) return;
    const nextEntry = gameState.breakfastQueue.find(e => !isBreakfastEntryBeingServed(e.id));
    if (!nextEntry) return;
    gameState.breakfastJobs.push({
      staffId,
      entryId: nextEntry.id,
      progress: 0,
      duration: breakfastDurationForSkill(staffer.skills.kitchen),
    });
  });

  gameState.breakfastJobs.forEach(job => { job.progress += deltaSeconds; });
  gameState.breakfastJobs.filter(j => j.progress >= j.duration).forEach(j => {
    const entry = gameState.breakfastQueue.find(e => e.id === j.entryId);
    if (entry) {
      gameState.funds += BREAKFAST_RATE_PER_GUEST * entry.partySize;
      gameState.breakfastQueue = gameState.breakfastQueue.filter(e => e.id !== entry.id);
    }
  });
  gameState.breakfastJobs = gameState.breakfastJobs.filter(j => j.progress < j.duration);
}

function setDailySpecial(key) {
  gameState.dailySpecial = (gameState.dailySpecial === key) ? null : key;
  renderGame();
}

// === SYSTEMS: SEATING ===
function getTagMatch(guest, room) {
  if (room.status !== 'clean') return null;
  const sp = SPECIES[guest.species];
  const needsMet = sp.needs.every(tag => room.tags.includes(tag));
  if (needsMet) return 'green';
  const needsPartial = sp.needs.some(tag => room.tags.includes(tag));
  return needsPartial ? 'amber' : null;
}

function selectGuest(guestId) {
  gameState.selectedGuestId = (gameState.selectedGuestId === guestId) ? null : guestId;
  gameState.selectedStaffId = null;
  gameState.viewingRoomId = null;
  gameState.pendingBuild = null;
  renderGame();
}

function toggleDinnerPlan() {
  const guest = gameState.arrivalQueue.find(g => g.id === gameState.selectedGuestId);
  if (!guest) return;
  guest.wantsDinner = !guest.wantsDinner;
  renderGame();
}

function attemptSeat(roomId) {
  const guest = gameState.arrivalQueue.find(g => g.id === gameState.selectedGuestId);
  if (!guest) return;
  const room = getRoomById(roomId);
  const match = getTagMatch(guest, room);
  if (!match) return;
  if (match === 'green') {
    seatGuest(guest.id, roomId);
  } else {
    gameState.pendingSeat = { guestId: guest.id, roomId };
  }
  renderGame();
}

function seatGuest(guestId, roomId) {
  const guest = gameState.arrivalQueue.find(g => g.id === guestId);
  if (!guest) return;
  const room = getRoomById(roomId);
  const sp = SPECIES[guest.species];

  if (guest.stayLength === undefined) {
    guest.stayLength = randomInt(sp.stayMin, sp.stayMax);
    guest.checkInDay = gameState.day;
  }

  const chunkSize = Math.min(room.capacity, guest.partySize);
  room.occupants = [{
    id: guest.id + '_' + room.id,
    species: guest.species,
    partySize: chunkSize,
    stayLength: guest.stayLength,
    checkInDay: guest.checkInDay,
    wantsDinner: guest.wantsDinner || false,
  }];
  room.status = gameState.stations.bellhop.length > 0 ? 'occupied' : 'checking-in';
  room.checkinProgress = 0;

  guest.partySize -= chunkSize;
  if (guest.partySize <= 0) {
    gameState.arrivalQueue = gameState.arrivalQueue.filter(g => g.id !== guestId);
    gameState.selectedGuestId = null;
  }
  gameState.pendingSeat = null;
}

function confirmSeat() {
  if (!gameState.pendingSeat) return;
  seatGuest(gameState.pendingSeat.guestId, gameState.pendingSeat.roomId);
  renderGame();
}

function cancelSeat() {
  gameState.pendingSeat = null;
  renderGame();
}

// === SYSTEMS: CONSTRUCTION ===
function openBuildConfirm(type) {
  if (gameState.construction[type]) return;
  if (getRoomsByType(type).length >= MAX_ROOMS_PER_FLOOR) return;
  gameState.pendingBuild = type;
  gameState.viewingRoomId = null;
  gameState.selectedGuestId = null;
  gameState.selectedStaffId = null;
  renderGame();
}

function cancelBuild() {
  gameState.pendingBuild = null;
  renderGame();
}

function confirmBuild() {
  const type = gameState.pendingBuild;
  if (!type) return;
  const rt = ROOM_TYPES[type];
  const cost = BUILD_COST_BY_TIER[rt.tier];
  if (gameState.funds < cost) { gameState.pendingBuild = null; renderGame(); return; }
  gameState.funds -= cost;
  gameState.construction[type] = { startDay: gameState.day, readyDay: gameState.day + BUILD_DURATION_DAYS };
  gameState.pendingBuild = null;
  renderGame();
}

// === SYSTEMS: STAFF & STATIONS ===
function selectStaff(staffId) {
  gameState.selectedStaffId = (gameState.selectedStaffId === staffId) ? null : staffId;
  gameState.selectedGuestId = null;
  gameState.viewingRoomId = null;
  gameState.pendingBuild = null;
  renderGame();
}

// Adds the selected staffer to `stationKey` (stations hold lists — nobody gets bumped just
// because someone else joins their station). If the moved staffer had an active job in
// progress — a clean, a breakfast, or a dinner service — only THEIR job is interrupted; a
// half-cleaned room reverts to dirty, and an interrupted diner/breakfast guest simply goes
// back to "waiting" (they never left their queue, so nothing needs to be re-inserted).
function reassignStaff(stationKey) {
  const staffId = gameState.selectedStaffId;
  if (!staffId) return;
  const prevStation = findStationOf(staffId);
  if (prevStation === stationKey) { gameState.selectedStaffId = null; renderGame(); return; }

  const hkIdx = gameState.cleaningJobs.findIndex(j => j.staffId === staffId);
  if (hkIdx !== -1) {
    const job = gameState.cleaningJobs[hkIdx];
    getRoomById(job.targetRoomId).status = 'dirty';
    gameState.cleaningJobs.splice(hkIdx, 1);
    rebuildHousekeepingQueue();
  }

  gameState.mealJobs = gameState.mealJobs.filter(j => j.staffId !== staffId);
  gameState.breakfastJobs = gameState.breakfastJobs.filter(j => j.staffId !== staffId);

  if (prevStation) {
    gameState.stations[prevStation] = gameState.stations[prevStation].filter(id => id !== staffId);
  }
  gameState.stations[stationKey].push(staffId);
  gameState.selectedStaffId = null;
  renderGame();
}

// === RENDER: HEADER ===
function renderHeader() {
  const pct = Math.min(100, (gameState.phaseTimeElapsed / PHASE_DURATIONS[gameState.phase]) * 100);
  return `
    <header>
      <div class="header-top">
        <h1>Day ${gameState.day} — ${capitalize(gameState.phase)}</h1>
        <div class="controls">
          <button onclick="openSaveModal()">&#128190;</button>
          <button onclick="togglePause()">${gameState.paused ? '&#9654;' : '&#10074;&#10074;'}</button>
          <button onclick="toggleSpeed()">${gameState.speed}x</button>
        </div>
      </div>
      <div class="phase-bar"><div class="phase-fill" style="width:${pct}%"></div></div>
      <div class="funds-line">&#128176; $${gameState.funds}</div>
    </header>
  `;
}

// === RENDER: TERRACE (restaurant) ===
function renderSpecialPicker() {
  const options = Object.keys(DAILY_SPECIALS).map(key => {
    const d = DAILY_SPECIALS[key];
    const active = gameState.dailySpecial === key;
    return `<div class="special-pill${active ? ' active' : ''}" onclick="setDailySpecial('${key}')" title="${d.name}">${d.emoji}</div>`;
  }).join('');
  return `
    <div class="special-picker">
      <div class="special-label">Today's Special</div>
      <div class="special-options">${options}</div>
    </div>
  `;
}

// A shared card renderer for both dining queues — shows a distinct "eating" state while
// being actively served, instead of just vanishing into an invisible job.
function diningCardHTML(entry, isBeingServed) {
  const sp = SPECIES[entry.species];
  const eatingClass = isBeingServed ? ' eating' : '';
  return `
    <div class="guest-card patience-${entry.patience}${eatingClass}">
      <div class="guest-emoji">${sp.emoji}${isBeingServed ? '<span class="eating-badge">🍽</span>' : ''}</div>
      ${entry.partySize > 1 ? `<div class="party-badge">×${entry.partySize}</div>` : ''}
    </div>
  `;
}

function renderMealSection(label, queue, isServedFn) {
  if (queue.length === 0) return '';
  const cards = queue.map(e => diningCardHTML(e, isServedFn(e.id))).join('');
  return `
    <div class="meal-section">
      <div class="meal-section-label">${label}</div>
      <div class="terrace-dinner-strip">${cards}</div>
    </div>
  `;
}

function renderTerrace() {
  return `
    <div id="terrace">
      <div class="terrace-label">🌇 Terrace Restaurant</div>
      <div class="terrace-row">
        <div class="kitchen-station-wrap">${renderStationSlot('kitchen')}</div>
        ${renderSpecialPicker()}
      </div>
      ${renderMealSection('🍳 Breakfast', gameState.breakfastQueue, isBreakfastEntryBeingServed)}
      ${renderMealSection('🍽 Dinner', gameState.dinnerQueue, isDinerBeingServed)}
    </div>
  `;
}

// === RENDER: ROOM CARD ===
function renderRoomCard(r) {
  const isBeingCleaned = r.status === 'cleaning';

  let highlightClass = '';
  let clickAttr = '';
  if (gameState.selectedGuestId) {
    const guest = gameState.arrivalQueue.find(g => g.id === gameState.selectedGuestId);
    if (guest) {
      const match = getTagMatch(guest, r);
      if (match) {
        highlightClass = ' highlight-' + match;
        clickAttr = ` onclick="attemptSeat('${r.id}')"`;
      }
    }
  }
  if (!clickAttr && r.status === 'occupied') {
    clickAttr = ` onclick="viewRoomInfo('${r.id}')"`;
  }

  let inner = '';
  if (isBeingCleaned) {
    const job = gameState.cleaningJobs.find(j => j.targetRoomId === r.id);
    const staffer = job ? STAFF.find(s => s.id === job.staffId) : null;
    inner = `<div class="room-icon">${staffer ? staffer.emoji : '🧹'}<span class="staff-badge-mini">🧹</span></div>`;
  } else if ((r.status === 'occupied' || r.status === 'checking-in') && r.occupants.length) {
    const occ = r.occupants[0];
    inner = `<div class="room-icon">${SPECIES[occ.species].emoji}${occ.wantsDinner ? '<span class="dinner-badge">🍽</span>' : ''}</div>${occ.partySize > 1 ? `<div class="room-party-badge">×${occ.partySize}</div>` : ''}`;
  }

  const statusLabel = isBeingCleaned ? 'cleaning' : (r.status === 'checking-in' ? 'checking in' : r.status);

  return `
    <div class="room-card-mini status-${r.status}${highlightClass}"${clickAttr}>
      ${inner}
      <div class="room-status-mini">${statusLabel}</div>
    </div>
  `;
}

function renderBuildSlot(type, currentCount) {
  const constr = gameState.construction[type];
  if (constr) {
    return `<div class="construction-slot">🚧<div class="construction-label">ready tomorrow</div></div>`;
  }
  if (currentCount >= MAX_ROOMS_PER_FLOOR) return '';
  return `<div class="build-slot" onclick="openBuildConfirm('${type}')">+</div>`;
}

// === RENDER: FLOOR ROW ===
function renderFloorRow(type) {
  const rt = ROOM_TYPES[type];
  const instances = getRoomsByType(type);
  const roomCards = instances.map(renderRoomCard).join('');
  const buildSlot = renderBuildSlot(type, instances.length);
  return `
    <div class="floor-row">
      <div class="floor-label">
        <div class="floor-name">${rt.name}</div>
        <div class="floor-meta">★${rt.tier} · ${rt.tags.join(', ')}</div>
      </div>
      <div class="floor-rooms-strip">${roomCards}${buildSlot}</div>
    </div>
  `;
}

// === RENDER: BUILDING (floors + elevator shaft) ===
function renderBuilding() {
  const floorRows = FLOOR_TYPES_TOP_TO_BOTTOM.map(renderFloorRow).join('');
  return `
    <div id="building">
      <div class="shaft-col"><div class="elevator-car">🛗</div></div>
      <div class="floors-col">${floorRows}</div>
    </div>
  `;
}

// === RENDER: ARRIVAL QUEUE & SELECTED-GUEST BAR ===
function guestCardHTML(g) {
  const sp = SPECIES[g.species];
  const selected = g.id === gameState.selectedGuestId ? ' selected' : '';
  return `
    <div class="guest-card patience-${g.patience}${selected}" onclick="selectGuest('${g.id}')">
      <div class="guest-emoji">${sp.emoji}</div>
      ${g.partySize > 1 ? `<div class="party-badge">×${g.partySize}</div>` : ''}
    </div>
  `;
}

function renderQueueArea() {
  if (gameState.arrivalQueue.length > 0) {
    return `<div class="queue-strip">${gameState.arrivalQueue.map(guestCardHTML).join('')}</div>`;
  }
  if (gameState.phase === 'afternoon') {
    return `<div class="queue-area">Waiting for the first guest…</div>`;
  }
  return `<div class="queue-area">Guests arrive in the afternoon</div>`;
}

function renderSelectedGuestBar() {
  if (!gameState.selectedGuestId) return '';
  const guest = gameState.arrivalQueue.find(g => g.id === gameState.selectedGuestId);
  if (!guest) return '';
  const sp = SPECIES[guest.species];
  const on = guest.wantsDinner;
  return `
    <div class="selected-guest-bar">
      <div class="selected-guest-info">${sp.emoji} ${sp.name} party</div>
      <div class="dinner-toggle${on ? ' on' : ''}" onclick="toggleDinnerPlan()">🍽 Dinner ${on ? 'ON' : 'OFF'} (+$${DINNER_ADDON_RATE_PER_GUEST}/guest/night)</div>
    </div>
  `;
}

// === RENDER: STAFF & STATIONS ===
function staffChipInner(staff, stationKey, selected) {
  const skill = stationKey ? staff.skills[stationKey] : null;
  return `
    <div class="staff-chip${selected ? ' selected' : ''}">
      <div class="staff-emoji">${staff.emoji}</div>
      <div class="staff-name">${staff.name}</div>
      ${skill ? `<div class="staff-skill">★${skill}</div>` : ''}
    </div>
  `;
}

function awayLabelFor(stationKey, staffId) {
  if (stationKey === 'housekeeping' && isActivelyCleaning(staffId)) return 'cleaning…';
  if (stationKey === 'kitchen' && isKitchenStaffBusy(staffId)) return 'serving…';
  return null;
}

function renderStationSlot(stationKey) {
  const staffIds = gameState.stations[stationKey];
  const staffList = staffIds.map(id => STAFF.find(s => s.id === id));
  const label = STATION_LABELS[stationKey];

  let highlightClass = '';
  let slotClickAttr = '';
  if (gameState.selectedStaffId && !staffIds.includes(gameState.selectedStaffId)) {
    highlightClass = ' station-target';
    slotClickAttr = ` onclick="reassignStaff('${stationKey}')"`;
  }

  let chipsHtml;
  if (staffList.length === 0) {
    chipsHtml = `<div class="empty-station">empty</div>`;
  } else {
    chipsHtml = `<div class="station-chips">` + staffList.map(staff => {
      const isSelected = staff.id === gameState.selectedStaffId;
      const awayLabel = awayLabelFor(stationKey, staff.id);
      const chipClickAttr = ` onclick="event.stopPropagation(); selectStaff('${staff.id}')"`;
      if (awayLabel) {
        return `
          <div class="staff-chip away${isSelected ? ' selected' : ''}"${chipClickAttr}>
            <div class="staff-emoji">${staff.emoji}</div>
            <div class="staff-name">${staff.name}</div>
            <div class="away-label">${awayLabel}</div>
          </div>
        `;
      }
      return `<div${chipClickAttr}>${staffChipInner(staff, stationKey, isSelected)}</div>`;
    }).join('') + `</div>`;
  }

  return `<div class="station-slot${highlightClass}"${slotClickAttr}>${chipsHtml}<div class="station-name">${label}</div></div>`;
}

function renderStationWarnings() {
  const warnings = [];
  if (gameState.stations.reception.length === 0) warnings.push('⚠️ Reception empty — patience decaying faster');
  if (gameState.stations.bellhop.length === 0) warnings.push('⚠️ Bellhop empty — check-ins take longer');
  if (gameState.stations.housekeeping.length === 0) warnings.push('⚠️ Housekeeping empty — rooms staying dirty');
  if (gameState.stations.kitchen.length === 0) {
    warnings.push('⚠️ Kitchen empty — no breakfast, no dinner service');
  } else if (!gameState.stations.kitchen.some(id => STAFF.find(s => s.id === id).skills.kitchen >= DINNER_MIN_SKILL)) {
    warnings.push('⚠️ Kitchen understaffed for dinner — walk-ins won\'t be served');
  }
  if (warnings.length === 0) return '';
  return `<div class="station-warnings">${warnings.join('<br>')}</div>`;
}

// === RENDER: RECEPTION ===
function renderReception() {
  const dirtyCount = gameState.rooms.filter(r => r.status === 'dirty' || r.status === 'cleaning').length;
  return `
    <div id="reception">
      <div class="reception-label">Reception</div>
      <div class="reception-row">
        ${renderStationSlot('reception')}
        ${renderStationSlot('bellhop')}
        ${renderStationSlot('housekeeping')}
      </div>
      ${renderStationWarnings()}
      <div class="housekeeping-status">🧹 ${dirtyCount} room${dirtyCount === 1 ? '' : 's'} needing a clean</div>
      ${renderSelectedGuestBar()}
      ${renderQueueArea()}
    </div>
  `;
}

// === RENDER: MODAL (amber-match confirmation) ===
function renderModal() {
  if (!gameState.pendingSeat) return '';
  const guest = gameState.arrivalQueue.find(g => g.id === gameState.pendingSeat.guestId);
  if (!guest) { gameState.pendingSeat = null; return ''; }
  const room = getRoomById(gameState.pendingSeat.roomId);
  const sp = SPECIES[guest.species];
  const missing = sp.needs.filter(tag => !room.tags.includes(tag));
  const chunkSize = Math.min(room.capacity, guest.partySize);
  const isPartial = chunkSize < guest.partySize;
  const who = isPartial ? `${chunkSize} of the ${sp.name} party` : `${sp.name} party`;
  return `
    <div class="modal-overlay">
      <div class="modal-card">
        <div class="modal-title">${sp.emoji} ${who} &rarr; ${room.name}?</div>
        <div class="modal-body">Missing: ${missing.join(', ')}. They'll settle, but they won't love it.${isPartial ? ' The rest stay in the queue.' : ''}</div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="cancelSeat()">Cancel</button>
          <button class="btn-confirm" onclick="confirmSeat()">Seat anyway</button>
        </div>
      </div>
    </div>
  `;
}

// === RENDER: MODAL (occupied-room info) ===
function renderRoomInfoModal() {
  if (gameState.pendingSeat || gameState.pendingBuild || gameState.showSaveModal) return '';
  if (!gameState.viewingRoomId) return '';
  const room = getRoomById(gameState.viewingRoomId);
  if (!room || room.status !== 'occupied' || room.occupants.length === 0) {
    gameState.viewingRoomId = null;
    return '';
  }
  const guest = room.occupants[0];
  const sp = SPECIES[guest.species];
  const nightsStayed = gameState.day - guest.checkInDay;
  const nightsLeft = Math.max(0, guest.stayLength - nightsStayed);
  const stayLabel = nightsLeft === 0
    ? 'Checking out tomorrow morning'
    : `${nightsLeft} more night${nightsLeft === 1 ? '' : 's'}`;
  const rate = (BUDGET_NIGHTLY_RATE[sp.budget] || 10) * guest.partySize;
  const dinnerLine = guest.wantsDinner ? `<br>🍽 Dinner plan (+$${DINNER_ADDON_RATE_PER_GUEST * guest.partySize}/night)` : '';
  return `
    <div class="modal-overlay" onclick="closeRoomInfo()">
      <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-title">${sp.emoji} ${sp.name} — ${room.name}</div>
        <div class="modal-body">Party of ${guest.partySize}<br>${stayLabel}<br>$${rate}/night${dinnerLine}</div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeRoomInfo()">Close</button>
        </div>
      </div>
    </div>
  `;
}

function viewRoomInfo(roomId) {
  gameState.viewingRoomId = (gameState.viewingRoomId === roomId) ? null : roomId;
  gameState.selectedGuestId = null;
  gameState.selectedStaffId = null;
  gameState.pendingBuild = null;
  renderGame();
}

function closeRoomInfo() {
  gameState.viewingRoomId = null;
  renderGame();
}

// === RENDER: MODAL (build confirmation) ===
function renderBuildModal() {
  if (gameState.pendingSeat || gameState.viewingRoomId || gameState.showSaveModal) return '';
  if (!gameState.pendingBuild) return '';
  const type = gameState.pendingBuild;
  const rt = ROOM_TYPES[type];
  const cost = BUILD_COST_BY_TIER[rt.tier];
  const afford = gameState.funds >= cost;
  return `
    <div class="modal-overlay" onclick="cancelBuild()">
      <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-title">Build another ${rt.name}?</div>
        <div class="modal-body">Cost: $${cost}${afford ? '' : ' — not enough funds'}<br>Ready tomorrow morning.</div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="cancelBuild()">Cancel</button>
          <button class="btn-confirm" onclick="confirmBuild()" ${afford ? '' : 'disabled'}>Build</button>
        </div>
      </div>
    </div>
  `;
}

// === RENDER: MODAL (save/load) ===
function renderSaveModal() {
  if (!gameState.showSaveModal) return '';
  return `
    <div class="modal-overlay" onclick="closeSaveModal()">
      <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-title">Save &amp; Load</div>
        <div class="modal-body">${gameState.lastSavedAt ? 'Last saved: ' + gameState.lastSavedAt : 'Not saved yet this session.'}<br>Autosaves each morning too.</div>
        <div class="modal-actions stacked">
          <button class="btn-confirm" onclick="manualSave()">Save now</button>
          <button class="btn-confirm" onclick="exportSave()">Export as file</button>
          <label class="btn-cancel file-label">
            Import from file
            <input type="file" accept="application/json" onchange="importSaveFile(event)">
          </label>
          <button class="btn-cancel" onclick="closeSaveModal()">Close</button>
        </div>
      </div>
    </div>
  `;
}

// === RENDER: MASTER ===
let lastRenderedHTML = null;
function renderGame() {
  const html = renderHeader() + renderTerrace() + renderBuilding() + renderReception() + renderModal() + renderRoomInfoModal() + renderBuildModal() + renderSaveModal();
  if (html !== lastRenderedHTML) {
    document.getElementById('app').innerHTML = html;
    lastRenderedHTML = html;
  }
}

// === CONTROLS ===
function togglePause() { gameState.paused = !gameState.paused; renderGame(); }
function toggleSpeed() { gameState.speed = gameState.speed === 1 ? 2 : 1; renderGame(); }

function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// === MAIN LOOP ===
const TICK_MS = 200;
setInterval(() => {
  if (gameState.paused) return;
  const delta = (TICK_MS / 1000) * gameState.speed;
  tickClock(delta);
  tickHousekeeping(delta);
  tickCheckins(delta);
  tickArrivals(delta);
  tickPopins(delta);
  tickBreakfast(delta);
  tickDinnerArrivals(delta);
  tickKitchen(delta);
  renderGame();
}, TICK_MS);

// === BOOT ===
(async function boot() {
  document.getElementById('app').innerHTML = '<div style="color:#3B6E5E;padding:20px;font-family:system-ui;">Loading…</div>';
  const loaded = await loadSavedGame();
  if (loaded) {
    sanitizeTransientState();
  } else {
    initGame();
  }
  renderGame();
})();
</script>
</body>
</html>
